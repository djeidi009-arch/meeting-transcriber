[project]
name = "transcriber"
version = "0.1.0"
description = "Обработка записей встреч: расшифровка, спикеры, summary"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper",
    "pyannote.audio==4.0.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
